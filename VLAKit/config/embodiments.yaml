    clause: "The robot is an AgileX PiPER arm with a Pika parallel gripper."
    ee_frame_fix: [[0, 0, 1], [0, 1, 0], [-1, 0, 0]]
    joints:
      count: 6
      names: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
      unit: rad
      note: "target: command:action.joints"
    hand: null
    body: absent
