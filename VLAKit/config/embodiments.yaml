# The embodiment keys: which normaliser entry a directory's actions and state go
# through, and the clause section 3 of every prompt of that key reads. One key
# per embodiment, so a clause names exactly one set of q01/q99 numbers: an
# entry in embodiments.json is compared with its clause, and the runner and
# build_manifest refuse two keys that share one.
#
# Read by tools/build_embodiment.py (directory -> key, or episode -> key for
# RH20T), tools/build_stats.py (one entry per key) and tools/build_cache.py
# (the clause a record renders). Nothing here is a number the model reads.
#
# Fields per key:
#   robot         what the robot is, paraphrased from the OXE embodiment spec
#                 (openvla_oxe_lerobot/_unify/embodiment_spec.json) and not
#                 copied from it
#   slots         the action slots the key's arms fill (arms[k].slot); a
#                 directory arm at another slot is refused
#   effector      parallel, three_finger, none or unknown. none: no directory
#                 of the key trains a gripper column (tools/build_stats.py
#                 check_effector refuses one that does); its layout masks
#                 the gripper with a written reason. A key whose every
#                 directory masks its gripper states gripper_valid false in
#                 embodiments.json, with gripper bounds 0 and 1 as every key.
#   stage         pretrain, or finetune: a key new to the lineage at post-train
#   clause        section 3's robot sentence, rendered as written
#   frame_clause / frame_clause_by_key: defaults and per-key frame sentences.
#   frame_clause_by_source: per-key source spellings retained from existing caches.
#   ee_frame_fix  R_c, applied as R_base<-ee . R_c to the state's 6D only (the
#                 mounted cameras, drot conversion and extrinsics keep the raw
#                 R), or null. Only agibot_g1 has one: its fingers close along
#                 EE x where every other stage-1 key with state closes along
#                 EE y; Rz(+90 deg) puts image-right at EE -y,
#                 as DROID and RH20T. It is part of the entry's identity.
#   action_from   finetune keys only: the pretrain key whose action entry this
#                 key copies, value for value
#   action_from_groups  with action_from only: the action groups copied
#                 (neo_vla.data.embodiment.ACTION_GROUPS: joints, ee, hand; ee is
#                 dpos, drot and the gripper, the columns every benchmark
#                 executes); the other groups are measured on the key's own rows.
#                 Not stated: every group is copied.
#   joints        v7: {count, names, unit} of one arm's
#                 joints in the stored order (URDF order where it was checked),
#                 or null for a key whose data records none
#   hand          v7: {count, order, unit, polarity_note} or null
#   body          v7: absent, or {base, torso, head}: base one of
#                 odometry, command, imu_yaw, still, none; torso and head the
#                 joint names, or none where the source records no such part
#                 (a body every dimension of which is none is UNKNOWN)
#                 tools/key_table.py reads the three; every entry identity holds
#                 them (build_stats copies them into embodiments.json v2).
#
# Mixture masses (analytic trajectory weights; they sum to 1.0):
# agibot_g1 0.500, franka_panda 0.1471 (DROID 0.100, RH20T cfg5 0.03801, nine
# OXE families about 0.0091), flexiv_rizon 0.13101, kuka_iiwa 0.08179,
# ur5 0.04948, kuka_qtopt 0.02835, xarm_pusher 0.02327, google_bcz 0.01807,
# google_rt1 0.01251, widowx 0.00431, dobbe_stick 0.00358, kinova_jaco 0.00022,
# fanuc_mate 0.00020, hello_stretch 0.00008, dlr_edan 0.00003.
#
# aloha_agilex: its EE approach axis (+x) and base-axis swap are post-train
# decisions; ee_frame_fix stays null until they are made.

schema: neo_vla_embodiment_keys_v2

# The official frame sentences. Per-key entries below override these only for
# already-published frame conventions; manifests may repeat, never replace them.
frame_clause:
  camera: "Each arm's frame token names the frame that arm's actions and extrinsics are written in."
  robot: "Actions are expressed in the robot base frame."

# Kept outside the generated key declarations so ingest keys --write preserves
# this prompt authority. Empty camera clauses are unused (robot-only corpora).
frame_clause_by_key:
  yam_bimanual: {camera: ""}
  robomind_franka: {camera: ""}
  robomind_ur5e: {camera: ""}
  robomind_fr3_dual:
    camera: ""
    robot: "Each arm's actions are expressed in that arm's own base frame."
  robomind_agilex_cobot_magic:
    robot: "Each arm's actions are expressed in that arm's own base frame."
  robomind_tienkung_gello:
    camera: ""
    robot: "Each arm's actions are expressed in that arm's own base frame."
  robomind_tienkung_xsens:
    camera: ""
    robot: "Each arm's actions are expressed in that arm's own base frame."

# RH20T is keyed per episode from meta/episodes.jsonl rh20t_robot, joined by
# the kept episode's own episode_index (never by line position).
rh20t_robot_keys:
