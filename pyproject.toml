[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-vla"
version = "0.1.0"
license = {text = "Apache-2.0"}
readme = "README.md"
description = "Flow-matching vision-language-action policy on the NEO backbone"
requires-python = ">=3.10"
authors = [{ name = "Weichen Fan" }]
dependencies = [
    "torch>=2.6",
    "torchvision",
    "transformers>=4.50",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pyyaml",
    "numpy",
    "pillow",
    "safetensors",
    "pyarrow",
    "av",
]

[project.optional-dependencies]
# MT_Und images behind the object store: the aoss client (its sdk directory is
# given by path) needs these.
object-store = ["boto3", "environs", "marshmallow"]
# Data preprocessing: the joint sidecars read AgiBot and DROID HDF5 (h5py); the
# camera-pose QC uses OpenCV and, for DROID, SciPy rotations.
prep = ["h5py", "scipy", "opencv-python-headless"]
# The private dataset upload in data_release/stage_upload.py --upload.
data-release = ["huggingface_hub"]
dev = ["pytest", "ruff", "h5py"]

[tool.setuptools.packages.find]
include = ["neo_vla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite imports the library, the data tools and its own helpers by name.
pythonpath = [".", "tools", "tests"]
markers = ["gpu: needs a GPU", "distributed: needs more than one process"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "BLE", "B"]
