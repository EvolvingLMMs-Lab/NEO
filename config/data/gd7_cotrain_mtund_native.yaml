defaults:
  - gd7
  - _self_

# Holds mt_und_denylist.json and the object-store client (sdk and config).
chat_root: ${oc.env:NEO_VLA_MTUND_ROOT}

# vlm:action = 1:9 over the run: 0.2222 on the chat steps, every other step.
cotrain_weight: 0.2222

train:
  epoch_samples: 573440000                  # scripts/stage2.sh states max_steps x 8,192 (614,400,000)
  sampling: rows                            # gd7's, stated
  understanding:
    _target_: neo_vla.data.understanding.MtUnd
    chat_format: neo_native
    registry: ${oc.env:NEO_VLA_MTUND_REGISTRY}
    line_index: ${oc.env:NEO_VLA_MTUND_LINE_INDEX}   # tools/build_mtund_line_index.py over that registry
    denylist: ${data.chat_root}/mt_und_denylist.json   # [] in this recipe
    tokenizer_path: ${model.tokenizer_path}   # NEOpp-2B-SFT's own; see above
    min_pixels: 65536                         # NEO's own
    max_pixels: 16777216                      # NEO's own
    max_tokens: 36864                         # NEO's model_max_length; a longer row is dropped, never cut
    pack_tokens: 36864                        # one NEO pack per chat micro-batch; null: one row per robot row
    pack_micro_batches: [7]                   # the chat micro-batch of the step's 8, the DDP sync one; null: every one
    pack_every_steps: 2                       # chat on the steps divisible by 2 (step 0 first); null or 1: every step
    force_pack: null                          # test hook (one fixture per leading step); keep null
    thinking_method: tag                      # what NEOpp-2B-SFT's trainer ran
    images_per_row: any                       # text-only and multi-image rows too, as NEO
    pixel_convention: ${model.vision.pixel_convention}   # must be neo_native: the tower's ImageNet gate
    draws: ${data.train.epoch_samples}        # one chat pass == one robot pass
    seed: ${seed}
    object_store: require                     # raise on a missing client rather than drop its entries
    sdk_path: ${data.chat_root}/aoss-python-sdk-2.2.6
    client_config: ${data.chat_root}/aoss.conf
