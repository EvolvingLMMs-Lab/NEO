# Pretraining: 113,400 steps at a global batch of 8,192 (8 a device x
# accumulation 8 x 128 GPUs), 928,972,800 samples, about one pass of the stage-1
# corpus rows; a linear warmup into a cosine decay towards lr_final.
#
# accumulation is left null and derived from the world size; the launchers
# state all three batch numbers.

max_steps: 113400
global_batch: 8192
per_device_batch: 8
gradient_accumulation_steps: null

learning_rate: 2.0e-4
# Backbone, vision tower and co-train head at this rate, the rest at
# learning_rate, one warmup and cosine for both; null is one group.
vlm_learning_rate: null
lr_final: 2.0e-5
warmup_steps: 2000
adam_betas: [0.9, 0.95]
adam_eps: 1.0e-8
weight_decay: 1.0e-10
